  <title>BrightStart - Get Involved</title>
  <link rel="stylesheet" href="../assets/css/style.css">

<body>
  <header>
    <h1>BrightStart</h1>
    <nav>
      <ul>

        <li><a href="about.html">About Us</a></li>

        <li><a href="donate.html">Get Involved</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>

  <section class="hero">
    <h2>Get Involved</h2>
    <p>Sign up as a student, volunteer, or supporter — every role helps BrightStart grow.</p>
  </section>

  <section class="content-section">
    <h3>Sign-Up Form</h3>
    <form>
      <label>Full Name:</label><br>
      <input type="text" required><br><br>

      <label>Email:</label><br>
      <input type="email" required><br><br>

      <label>I am signing up as:</label><br>
      <select>
        <option>Student</option>
        <option>Volunteer</option>
        <option>Donor</option>
      </select><br><br>

      <label>Area of Interest:</label><br>
      <select>
        <option>After-School Tutoring</option>
        <option>Mentorship Programme</option>
        <option>Life Skills Workshops</option>
      </select><br><br>

      <button type="submit" class="cta-button">Submit</button>
    </form>
  </section>

  <footer>

  </footer>
<script src="../assets/js/script.js"></script>
